name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund

      - name: Build portable Windows app
        working-directory: windows
        run: npm run build:win

      - name: Upload executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $asset = Get-ChildItem "windows/release/RiRiQing-*-Windows-x64.exe" | Select-Object -First 1
          if (-not $asset) { throw "Windows executable was not created." }
          gh release upload $env:RELEASE_TAG $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
